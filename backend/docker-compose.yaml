services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:password@db:5432/courseapp"
      student_jwt_secret: "jwt-secret-1"
      FRONTEND_URL: "http://localhost:5173"
    depends_on:
      db:
        # wait for postgres to actually accept connections, not just for the container to start,
        # otherwise the migration step in the api container can run before the db is ready
        condition: service_healthy

  web:
    build: ../frontend
    ports:
      - "5173:80"
    depends_on:
      - api

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: courseapp
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
